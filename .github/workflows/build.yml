          @end

          // ---------- logica ----------
          static void *gCache[256];
          static int gCacheN = 0;
          static double gLastScan = 0;

          static void *findAll(void *klass) {
            if (!gFindM || !klass) return NULL;
            void *type = p_class_get_type(klass);
            void *args[1] = { type };
            void *exc = NULL;
            return p_runtime_invoke(gFindM, NULL, args, &exc);
          }

          static void scan(void) {
            double now = CACurrentMediaTime();
            if (now - gLastScan < 0.25 && gCacheN) return;
            gLastScan = now; gCacheN = 0;
            if (!gPlayerCls) return;
            typedef struct { void *klass; void *mon; void *bounds; uint64_t len; void *v[1]; } Arr;
            Arr *a = (Arr *)findAll(gPlayerCls);
            if (a) for (uint64_t i = 0; i < a->len && gCacheN < 256; i++) gCache[gCacheN++] = a->v[i];
            if (gNpc && gNpcCls) {
              Arr *b = (Arr *)findAll(gNpcCls);
              if (b) for (uint64_t i = 0; i < b->len && gCacheN < 256; i++) gCache[gCacheN++] = b->v[i];
            }
          }

          static void *localPlayer(void) {
            if (gLocalCls && gLocalF[0]) {
              void *o = staticObj(gLocalCls, gLocalF);
              if (o) return o;
            }
            for (int i = 0; i < gCacheN; i++) {
              void *o = gCache[i];
              if (!o) continue;
              if (oLocal1 && readB(o, oLocal1)) return o;
              if (oLocal2 && readB(o, oLocal2)) return o;
            }
            return NULL;
          }

          static CGPoint w2s(void *cam, V3 wp, CGFloat scale, BOOL *ok) {
            V3 sp = p_w2s(cam, wp);
            *ok = (sp.z > 0.01f);
            return CGPointMake(sp.x / scale, sp.y / scale);
          }
          static float ang(V3 a, V3 b) {
            float d = a.x*b.x + a.y*b.y + a.z*b.z;
            float la = sqrtf(a.x*a.x+a.y*a.y+a.z*a.z), lb = sqrtf(b.x*b.x+b.y*b.y+b.z*b.z);
            if (la < 1e-5f || lb < 1e-5f) return 0;
            float c = d / (la*lb);
            if (c > 1) c = 1; if (c < -1) c = -1;
            return acosf(c) * 57.29578f;
          }

          static void tick(CADisplayLink *l) {
            if (!gReady) return;
            static double last = 0;
            double now = CACurrentMediaTime();
            float dt = last ? (float)(now - last) : 0.016f;
            if (dt > 0.1f) dt = 0.1f;
            last = now;

            [gSegs removeAllObjects]; [gLabels removeAllObjects];
            scan();

            void *cam = p_cam_main();
            if (!cam) { [gOverlay setNeedsDisplay]; return; }
            void *camT = p_comp_transform(cam);
            if (!camT) { [gOverlay setNeedsDisplay]; return; }
            V3 camPos = p_get_pos(camT);
            Quat camRot = p_get_rot(camT);

            void *local = localPlayer();
            if (local) { void *lt = p_comp_transform(local); if (lt) camPos = p_get_pos(lt); }
            int lteam = local ? readInt(local, oTeam) : -1;

            CGFloat viewW = gOverlay.bounds.size.width;
            CGFloat scale = 1.0;
            if (p_screen_w && p_screen_w() > 0 && viewW > 0) scale = (CGFloat)p_screen_w() / viewW;

            CGPoint center = CGPointMake(gOverlay.bounds.size.width / 2, gOverlay.bounds.size.height / 2);
            void *best = NULL; float bestD = 1e9f;

            for (int i = 0; i < gCacheN; i++) {
              void *e = gCache[i];
              if (!e || e == local) continue;
              if (oDead && readB(e, oDead)) continue;
              if (oHp && readF(e, oHp) <= 0.01f) continue;

              void *t = p_comp_transform(e);
              if (!t) continue;
              V3 p = p_get_pos(t);
              float d = dist3(camPos, p);
              if (d > 200.0f) continue;

              BOOL enemy = YES;
              if (oTeam) { int tm = readInt(e, oTeam); if (tm != -1 && lteam != -1) enemy = (tm != lteam); }
              if (!enemy) continue;

              void *head = findBone(t, kHead, 6);
              if (!head) continue;
              BOOL ok = NO;
              CGPoint sp = w2s(cam, p_get_pos(head), scale, &ok);

              if (gAimbot && ok) {
                float sd = hypotf(sp.x - center.x, sp.y - center.y);
                if (sd < gAimFov && sd < bestD) { bestD = sd; best = e; }
              }

              if (gEsp && d <= gEspRange) {
                const char **names[8] = { kHead, kNeck, kChest, kHips, kLH, kRH, kLF, kRF };
                int counts[8] = { 6, 4, 6, 5, 4, 4, 4, 4 };
                CGPoint pts[8]; BOOL okp[8];
                for (int b = 0; b < 8; b++) {
                  void *bt = findBone(t, names[b], counts[b]);
                  okp[b] = NO;
                  if (!bt) continue;
                  pts[b] = w2s(cam, p_get_pos(bt), scale, &okp[b]);
                }
                int pairs[8][2] = {{0,1},{1,2},{2,3},{3,6},{3,7},{2,4},{2,5},{0,3}};
                for (int k = 0; k < 8; k++) {
                  int a1 = pairs[k][0], b1 = pairs[k][1];
                  if (!okp[a1] || !okp[b1]) continue;
                  Seg s; s.a = pts[a1]; s.b = pts[b1]; s.npc = NO;
                  [gSegs addObject:[NSValue valueWithBytes:&s objCType:@encode(Seg)]];
                }
                [gLabels addObject:[NSValue valueWithBytes:&sp objCType:@encode(CGPoint)]];
              }
            }

            if (gAimbot && best) {
              void *bt = p_comp_transform(best);
              void *head = bt ? findBone(bt, kHead, 6) : NULL;
              if (head) {
                V3 tp = p_get_pos(head);
                tp.x += ((rand() % 100) - 50) * 0.0004f;
                tp.y += ((rand() % 100) - 50) * 0.0004f;
                tp.z += ((rand() % 100) - 50) * 0.0004f;
                V3 dir = (V3){ tp.x - camPos.x, tp.y - camPos.y, tp.z - camPos.z };
                V3 up = (V3){0,1,0};
                if (fabsf(dir.x) < 0.01f && fabsf(dir.z) < 0.01f) up = (V3){0,0,1};
                Quat want = p_look_rot(dir, up);
                float dAng = ang((V3){0,0,-1}, dir);
                float step = gAimSpeed * dt;
                float k = (dAng > 0.01f) ? MIN(1.0f, step / dAng) : 1.0f;
                p_set_rot(camT, p_slerp(camRot, want, k));
              }
            }

            [gOverlay setNeedsDisplay];
          }

          - (void)dummy { }

          // ---------- arranque ----------
          static void *boot(void *arg) {
            for (int i = 0; i < 900; i++) {
              if (resolveIl2Cpp()) break;
              usleep(100000);
            }
            if (!p_domain_get || !p_domain_get()) return NULL;

            for (int i = 0; i < (int)(sizeof(kPlayerCls)/sizeof(*kPlayerCls)) && !gPlayerCls; i++)
              gPlayerCls = cls(kPlayerCls[i]);
            if (!gPlayerCls) return NULL;
            for (int i = 0; i < (int)(sizeof(kNpcCls)/sizeof(*kNpcCls)) && !gNpcCls; i++)
              gNpcCls = cls(kNpcCls[i]);

            gObjCls = clsNS("UnityEngine", "Object");
            if (gObjCls) gFindM = p_method_from_name(gObjCls, "FindObjectsOfType", 1);

            oTeam = off(gPlayerCls, "team");
            if (!oTeam) oTeam = off(gPlayerCls, "Team");
            if (!oTeam) oTeam = off(gPlayerCls, "teamId");
            oHp = off(gPlayerCls, "hp");
            if (!oHp) oHp = off(gPlayerCls, "health");
            oDead = off(gPlayerCls, "isDead");
            if (!oDead) oDead = off(gPlayerCls, "dead");
            oLocal1 = off(gPlayerCls, "isLocalPlayer");
            oLocal2 = off(gPlayerCls, "isMine");

            for (int i = 0; i < (int)(sizeof(kMgrCls)/sizeof(*kMgrCls)) && !gLocalCls; i++) {
              void *m = cls(kMgrCls[i]);
              if (!m) continue;
              for (int j = 0; j < (int)(sizeof(kLocalSt)/sizeof(*kLocalSt)); j++) {
                if (p_field_from_name(m, kLocalSt[j])) {
                  gLocalCls = m;
                  strlcpy(gLocalF, kLocalSt[j], sizeof(gLocalF));
                  break;
                }
              }
            }

            gReady = YES;
            dispatch_async(dispatch_get_main_queue(), ^{
              UIWindowScene *sc = nil;
              for (UIScene *s in UIApplication.sharedApplication.connectedScenes)
                if ([s isKindOfClass:[UIWindowScene class]]) { sc = (UIWindowScene *)s; break; }
              gWin = sc ? [[_BSWin alloc] initWithWindowScene:sc]
                        : [[_BSWin alloc] initWithFrame:UIScreen.mainScreen.bounds];
              gWin.windowLevel = UIWindowLevelAlert + 1;
              gWin.backgroundColor = [UIColor clearColor];
              _BSMenu *m = [_BSMenu new];
              gWin.rootViewController = m;
              [gWin makeKeyAndVisible];
              m.link = [CADisplayLink displayLinkWithTarget:m selector:@selector(tick:)];
              [m.link addToRunLoop:NSRunLoop.mainRunLoop forMode:NSRunLoopCommonModes];
            });
            return NULL;
          }

          __attribute__((constructor))
          static void init(void) {
            load();
            dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 3 * NSEC_PER_SEC),
                           dispatch_get_global_queue(0, 0), ^{ installAnti(); });
            pthread_t th;
            pthread_create(&th, NULL, boot, NULL);
            pthread_detach(th);
          }
          EOF

      - name: build
        run: |
          ls -l libbs.xm
          make package FINALPACKAGE=1 DEBUG=0 STRIP=1

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packages/*.deb
