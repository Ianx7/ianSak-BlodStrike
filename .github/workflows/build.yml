let fm = FileManager.iCloud()
let path = fm.joinPath(fm.documentsDirectory(), "ianSak-panel.json")

let cfg = {
  aimbot: true, aimBone: "Cabeza", aimFov: 120, aimSmooth: 4,
  showFovCircle: true, fovColor: "Rojo", fovThickness: 2,
  cameraFov: 90, esp: true, espBox: true, espName: true, espHealth: true, espDistance: true,
  wallhack: false, chams: true, noRecoil: true, noSpread: false, rapidFire: false,
  fps: true, crosshair: true
}
if (fm.fileExists(path)) {
  try { cfg = {...cfg, ...JSON.parse(fm.readString(path))} } catch(e){}
}

let html = `
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b0b0f;color:#fff;font-family:-apple-system;padding-bottom:30px}
.top{background:linear-gradient(135deg,#ff1e1e,#7a0000);padding:18px 16px 12px;border-radius:0 0 22px 22px}
.top h1{margin:0;font-size:22px}.top h1 span{color:#ffd700}
.top p{margin:4px 0 0;font-size:12px;opacity:.85}
.badge{background:rgba(255,255,255,.2);padding:3px 8px;border-radius:20px;font-size:11px;float:right}
.tabs{display:flex;gap:8px;padding:12px 16px}
.tab{flex:1;text-align:center;padding:10px 0;border-radius:12px;background:#1c1c22;font-size:13px;font-weight:700;color:#aaa}
.tab.active{background:#ff1e1e;color:#fff}
.card{margin:0 16px 12px;background:#16161c;border:1px solid #26262e;border-radius:16px;padding:6px 14px}
.card h3{font-size:12px;color:#ff5555;letter-spacing:1.5px;margin:12px 0 4px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #22222a}
.row:last-child{border:none}.row b{font-size:15px}.row small{display:block;color:#888;font-size:11px}
.sw{width:50px;height:29px;background:#2a2a33;border-radius:20px;position:relative;flex-shrink:0}
.sw:before{content:'';position:absolute;top:3px;left:3px;width:23px;height:23px;background:#fff;border-radius:50%}
.sw.on{background:#ff1e1e}.sw.on:before{left:24px}
.pill{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.pill div{padding:7px 12px;border-radius:20px;background:#22222a;font-size:12px;color:#bbb}
.pill div.on{background:#ff1e1e;color:#fff}
.slider{padding:8px 0 14px}.slider label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
.slider label span{color:#ffd700;font-weight:700}
input[type=range]{width:100%;-webkit-appearance:none;height:6px;background:#2a2a33;border-radius:10px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;background:#ff1e1e;border-radius:50%;border:3px solid #fff}
.fov-preview{width:140px;height:140px;margin:12px auto;border-radius:50%;border:2px solid #ff1e1e;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(255,30,30,.05)}
.fov-preview:before{content:'';width:4px;height:4px;background:#ffd700;border-radius:50%;position:absolute}
.fov-preview span{font-size:11px;color:#aaa;margin-top:100px}
.btn{width:100%;padding:15px;border:none;border-radius:14px;background:linear-gradient(135deg,#ff1e1e,#c80000);color:#fff;font-size:16px;font-weight:800}
.footer{padding:4px 16px}.status{text-align:center;font-size:11px;color:#666;margin-top:10px}
</style></head><body>
<div class="top"><div class="badge">● ONLINE</div><h1>ianSak <span>PANEL</span></h1><p>BLOOD STRIKE • v3 + FOV</p></div>
<div class="tabs">
  <div class="tab active" id="t-aim" onclick="showTab('aim')">🎯 AIM</div>
  <div class="tab" id="t-fov" onclick="showTab('fov')">👁️ FOV</div>
  <div class="tab" id="t-visual" onclick="showTab('visual')">✨ VISUAL</div>
  <div class="tab" id="t-misc" onclick="showTab('misc')">⚙️ MISC</div>
</div>

<!-- AIM -->
<div id="page-aim">
  <div class="card"><h3>AIMBOT</h3>
    <div class="row"><div><b>Aimbot</b><small>Apunta solo al enemigo</small></div><div class="sw ${cfg.aimbot?'on':''}" onclick="tgl(this,'aimbot')"></div></div>
    <div class="row"><div><b>Visible Check</b><small>No apunta tras pared</small></div><div class="sw on" onclick="tgl(this,'vis')"></div></div>
    <div style="padding:4px 0 6px"><small style="color:#888">HUESO</small><div class="pill">
      <div data-v="Cabeza" class="${cfg.aimBone=='Cabeza'?'on':''}" onclick="sel(this,'aimBone')">Cabeza</div>
      <div data-v="Pecho" class="${cfg.aimBone=='Pecho'?'on':''}" onclick="sel(this,'aimBone')">Pecho</div>
      <div data-v="Cuello" class="${cfg.aimBone=='Cuello'?'on':''}" onclick="sel(this,'aimBone')">Cuello</div>
    </div></div>
    <div class="slider"><label>Suavidad <span id="smV">${cfg.aimSmooth}</span></label><input type="range" min="1" max="10" value="${cfg.aimSmooth}" oninput="document.getElementById('smV').innerText=this.value; window.aimSmooth=this.value"></div>
  </div>
  <div class="card"><h3>ARMA</h3>
    <div class="row"><div><b>Sin Retroceso</b></div><div class="sw ${cfg.noRecoil?'on':''}" onclick="tgl(this,'noRecoil')"></div></div>
    <div class="row"><div><b>Sin Dispersión</b></div><div class="sw ${cfg.noSpread?'on':''}" onclick="tgl(this,'noSpread')"></div></div>
    <div class="row"><div><b>Fuego Rápido</b></div><div class="sw ${cfg.rapidFire?'on':''}" onclick="tgl(this,'rapidFire')"></div></div>
  </div>
</div>

<!-- FOV NUEVO -->
<div id="page-fov" style="display:none">
  <div class="card"><h3>🎯 FOV DEL AIM</h3>
    <div class="fov-preview" id="preview"><span id="previewTxt">FOV ${cfg.aimFov}</span></div>
    <div class="slider"><label>Aim FOV <span id="fovV">${cfg.aimFov}</span></label><input type="range" min="30" max="250" value="${cfg.aimFov}" oninput="updateFov(this.value)"></div>
    <div class="row"><div><b>Mostrar círculo FOV</b><small>Se ve el círculo en pantalla</small></div><div class="sw ${cfg.showFovCircle?'on':''}" onclick="tgl(this,'showFovCircle')"></div></div>
    <div style="padding:4px 0 6px"><small style="color:#888">COLOR DEL CÍRCULO</small><div class="pill">
      <div data-v="Rojo" class="${cfg.fovColor=='Rojo'?'on':''}" onclick="sel(this,'fovColor');changeColor('red')">🔴 Rojo</div>
      <div data-v="Verde" class="${cfg.fovColor=='Verde'?'on':''}" onclick="sel(this,'fovColor');changeColor('lime')">🟢 Verde</div>
      <div data-v="Blanco" class="${cfg.fovColor=='Blanco'?'on':''}" onclick="sel(this,'fovColor');changeColor('white')">⚪ Blanco</div>
      <div data-v="Amarillo" class="${cfg.fovColor=='Amarillo'?'on':''}" onclick="sel(this,'fovColor');changeColor('yellow')">🟡 Amarillo</div>
    </div></div>
    <div class="slider"><label>Grosor del círculo <span id="thV">${cfg.fovThickness}</span></label><input type="range" min="1" max="5" value="${cfg.fovThickness}" oninput="document.getElementById('thV').innerText=this.value; document.getElementById('preview').style.borderWidth=this.value+'px'; window.fovThickness=this.value"></div>
  </div>
  <div class="card"><h3>📷 FOV DE CÁMARA</h3>
    <div class="slider"><label>Cámara FOV <span id="camV">${cfg.cameraFov}</span></label><input type="range" min="60" max="130" value="${cfg.cameraFov}" oninput="document.getElementById('camV').innerText=this.value+'°'; window.cameraFov=this.value"></div>
    <p style="font-size:12px;color:#888;line-height:1.5">60° = normal<br>90° = se ve más ancho<br>120° = ultra ancho, se ve todo</p>
  </div>
</div>

<!-- VISUAL -->
<div id="page-visual" style="display:none">
  <div class="card"><h3>ESP</h3>
    <div class="row"><div><b>ESP Master</b></div><div class="sw ${cfg.esp?'on':''}" onclick="tgl(this,'esp')"></div></div>
    <div class="row"><div><b>Caja / Box</b></div><div class="sw ${cfg.espBox?'on':''}" onclick="tgl(this,'espBox')"></div></div>
    <div class="row"><div><b>Nombre</b></div><div class="sw ${cfg.espName?'on':''}" onclick="tgl(this,'espName')"></div></div>
    <div class="row"><div><b>Vida</b></div><div class="sw ${cfg.espHealth?'on':''}" onclick="tgl(this,'espHealth')"></div></div>
    <div class="row"><div><b>Distancia</b></div><div class="sw ${cfg.espDistance?'on':''}" onclick="tgl(this,'espDistance')"></div></div>
    <div class="row"><div><b>Chams</b></div><div class="sw ${cfg.chams?'on':''}" onclick="tgl(this,'chams')"></div></div>
    <div class="row"><div><b>Wallhack</b></div><div class="sw ${cfg.wallhack?'on':''}" onclick="tgl(this,'wallhack')"></div></div>
  </div>
</div>

<div id="page-misc" style="display:none">
  <div class="card"><h3>EXTRA</h3>
    <div class="row"><div><b>Mostrar FPS</b></div><div class="sw ${cfg.fps?'on':''}" onclick="tgl(this,'fps')"></div></div>
    <div class="row"><div><b>Crosshair</b></div><div class="sw ${cfg.crosshair?'on':''}" onclick="tgl(this,'crosshair')"></div></div>
  </div>
</div>

<div class="footer"><button class="btn" onclick="guardar()">💾 GUARDAR Y APLICAR</button><div class="status">ianSak • FOV agregado</div></div>

<script>
let S={}
function tgl(el,k){el.classList.toggle('on');S[k]=el.classList.contains('on')}
function sel(el,k){[...el.parentElement.children].forEach(c=>c.classList.remove('on'));el.classList.add('on');S[k]=el.dataset.v}
function showTab(t){['aim','fov','visual','misc'].forEach(x=>{document.getElementById('page-'+x).style.display=x==t?'block':'none';document.getElementById('t-'+x).classList.toggle('active',x==t)})}
function updateFov(v){
  document.getElementById('fovV').innerText=v;
  document.getElementById('previewTxt').innerText='FOV '+v;
  let size = 70 + (v-30)*0.35;
  let p=document.getElementById('preview');
  p.style.width=size+'px'; p.style.height=size+'px';
  window.aimFov=v;
}
function changeColor(c){document.getElementById('preview').style.borderColor=c}
function guardar(){window.done=JSON.stringify({...S,aimFov:window.aimFov,cameraFov:window.cameraFov,fovThickness:window.fovThickness,aimSmooth:window.aimSmooth})}
</script>
</body></html>
`

let web = new WebView()
await web.loadHTML(html)
await web.present(true)
let out = await web.evaluateJavaScript(`window.done || '{}'`)
try {
  let n = JSON.parse(out)
  if (Object.keys(n).length) {
    cfg = {...cfg, ...n}
    if(n.aimFov) cfg.aimFov = parseInt(n.aimFov)
    if(n.cameraFov) cfg.cameraFov = parseInt(n.cameraFov)
    fm.writeString(path, JSON.stringify(cfg))
  }
} catch(e){}
let a = new Alert()
a.title = "✅ FOV Guardado"
a.message = `Aim FOV: ${cfg.aimFov}\\nCámara FOV: ${cfg.cameraFov}°\\nCírculo: ${cfg.showFovCircle?'ON':'OFF'}`
a.addAction("Listo")
await a.present()
Script.complete()
