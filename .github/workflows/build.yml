            [self sld:236 lo:30 hi:250 v:gAimFov act:@selector(f1:)];
            [self cap:274 t:[NSString stringWithFormat:@"Cam FOV: %.0f", gCamFov]];
            [self sld:296 lo:60 hi:130 v:gCamFov act:@selector(f2:)];
