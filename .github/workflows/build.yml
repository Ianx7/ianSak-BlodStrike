          #import <stdlib.h>
          #import <string.h>
          #import <math.h>
          #import <pthread.h>
          #import <QuartzCore/QuartzCore.h>
          #import <substrate.h>

          typedef struct { float x, y, z; } V3;
          typedef struct { float x, y, z, w; } Quat;
          typedef struct { CGPoint a, b; BOOL npc; } Seg;

          static BOOL  gAimbot   = YES;
          static BOOL  gEsp      = YES;
          static BOOL  gNpc      = YES;
          static BOOL  gAnti     = YES;
          static BOOL  gShowFov  = YES;
          static float gAimFov   = 120.0f;
          static float gCamFov   = 90.0f;
          static float gAimSpeed = 420.0f;
          static float gEspRange = 60.0f;
          static BOOL  gReady    = NO;

          static NSUserDefaults *defs(void) {
            static NSUserDefaults *d;
            static dispatch_once_t o;
            dispatch_once(&o, ^{ d = [[NSUserDefaults alloc] initWithSuiteName:@"com.apple.bsutil"]; });
            return d;
          }
          static void save(void) {
            NSUserDefaults *d = defs();
            [d setBool:gAimbot forKey:@"a"]; [d setBool:gEsp forKey:@"e"];
            [d setBool:gNpc forKey:@"n"];    [d setBool:gAnti forKey:@"t"];
            [d setBool:gShowFov forKey:@"f"];
            [d setFloat:gAimFov forKey:@"af"]; [d setFloat:gCamFov forKey:@"cf"];
            [d setFloat:gAimSpeed forKey:@"as"]; [d setFloat:gEspRange forKey:@"er"];
            [d synchronize];
          }
          static void load(void) {
            NSUserDefaults *d = defs();
            if ([d objectForKey:@"a"]) {
              gAimbot = [d boolForKey:@"a"]; gEsp = [d boolForKey:@"e"];
              gNpc = [d boolForKey:@"n"];    gAnti = [d boolForKey:@"t"];
              gShowFov = [d boolForKey:@"f"];
              gAimFov = [d floatForKey:@"af"]; gCamFov = [d floatForKey:@"cf"];
              gAimSpeed = [d floatForKey:@"as"]; gEspRange = [d floatForKey:@"er"];
            }
          }

          // ---------- antidetect ----------
          static const char *kHide[] = {
            "libbs.dylib", "com.apple.bsutil", "ianSak",
            "/var/jb", "/jb/", "/usr/lib/libsubstrate", "/usr/lib/libellekit",
            "/usr/lib/libhooker", "/usr/lib/TweakInject", "/Library/MobileSubstrate",
            "/usr/lib/libzhuowei", "/usr/sbin/frida-server", "/usr/bin/cycript",
            "/.installed_unc0ver", "/.bootstrapped", "/var/lib/dpkg",
            "/private/var/lib/dpkg", "/usr/lib/libjailbreak"
          };
          static BOOL hidden(const char *p) {
            if (!p) return NO;
            for (size_t i = 0; i < sizeof(kHide)/sizeof(kHide[0]); i++)
              if (strstr(p, kHide[i])) return YES;
            return NO;
          }
          static int (*o_stat)(const char *, struct stat *);
          static int (*o_lstat)(const char *, struct stat *);
          static int (*o_access)(const char *, int);
          static int (*o_open)(const char *, int, mode_t);
          static FILE *(*o_fopen)(const char *, const char *);
          static DIR *(*o_opendir)(const char *);
          static char *(*o_getenv)(const char *);

          static int h_stat(const char *p, struct stat *b) { if (hidden(p)) { errno = ENOENT; return -1; } return o_stat(p, b); }
          static int h_lstat(const char *p, struct stat *b) { if (hidden(p)) { errno = ENOENT; return -1; } return o_lstat(p, b); }
          static int h_access(const char *p, int m) { if (hidden(p)) { errno = ENOENT; return -1; } return o_access(p, m); }
          static int h_open(const char *p, int f, mode_t m) { if (hidden(p)) { errno = ENOENT; return -1; } return o_open(p, f, m); }
          static FILE *h_fopen(const char *p, const char *m) { if (hidden(p)) return NULL; return o_fopen(p, m); }
          static DIR *h_opendir(const char *p) { if (hidden(p)) return NULL; return o_opendir(p); }
          static char *h_getenv(const char *k) {
            if (k && !strcmp(k, "DYLD_INSERT_LIBRARIES")) return NULL;
            return o_getenv(k);
          }

          static uint32_t (*o_icount)(void);
          static const char *(*o_iname)(uint32_t);
          static int gMyImg = -1;
          static uint32_t h_icount(void) {
            uint32_t n = o_icount();
            return (gMyImg >= 0 && (uint32_t)gMyImg < n) ? n - 1 : n;
          }
          static const char *h_iname(uint32_t i) {
            if (gMyImg >= 0 && (int)i >= gMyImg) return o_iname(i + 1);
            return o_iname(i);
          }
          static void installAnti(void) {
            if (!gAnti) return;
            for (uint32_t i = 0; i < _dyld_image_count(); i++) {
              const char *n = _dyld_get_image_name(i);
              if (n && strstr(n, "libbs.dylib")) { gMyImg = (int)i; break; }
            }
            MSHookFunction((void *)stat,   (void *)h_stat,   (void **)&o_stat);
            MSHookFunction((void *)lstat,  (void *)h_lstat,  (void **)&o_lstat);
            MSHookFunction((void *)access, (void *)h_access, (void **)&o_access);
            MSHookFunction((void *)open,   (void *)h_open,   (void **)&o_open);
            MSHookFunction((void *)fopen,  (void *)h_fopen,  (void **)&o_fopen);
            MSHookFunction((void *)opendir,(void *)h_opendir,(void **)&o_opendir);
            MSHookFunction((void *)getenv, (void *)h_getenv, (void **)&o_getenv);
            MSHookFunction((void *)_dyld_image_count,   (void *)h_icount, (void **)&o_icount);
            MSHookFunction((void *)_dyld_get_image_name,(void *)h_iname,  (void **)&o_iname);
          }

          // ---------- il2cpp ----------
          static void *(*p_domain_get)(void);
          static void *(*p_thread_attach)(void *);
          static void **(*p_get_assemblies)(void *, uint32_t *);
          static void *(*p_assembly_image)(void *);
          static void *(*p_class_from_name)(void *, const char *, const char *);
          static void *(*p_field_from_name)(void *, const char *);
          static size_t (*p_field_offset)(void *);
          static void (*p_field_static_get)(void *, void *);
          static void *(*p_class_get_type)(void *);
          static void *(*p_method_from_name)(void *, const char *, int);
          static void *(*p_runtime_invoke)(void *, void *, void **, void **);
          static void *(*p_comp_transform)(void *);
          static V3 (*p_get_pos)(void *);
          static Quat (*p_get_rot)(void *);
          static void (*p_set_rot)(void *, Quat);
          static Quat (*p_look_rot)(V3, V3);
          static Quat (*p_slerp)(Quat, Quat, float);
          static void *(*p_cam_main)(void);
          static V3 (*p_w2s)(void *, V3);
          static void *(*p_find)(void *, void *);
          static void *(*p_get_child)(void *, int);
          static int (*p_child_count)(void *);
          static void *(*p_string_new)(const char *);
          static int (*p_screen_w)(void);
          static int (*p_screen_h)(void);

          #define RES(x) p_##x = dlsym(RTLD_DEFAULT, "il2cpp_" #x)

          static BOOL resolveIl2Cpp(void) {
            RES(domain_get); RES(thread_attach); RES(domain_get_assemblies);
            RES(assembly_get_image); RES(class_from_name); RES(class_get_field_from_name);
            RES(field_get_offset); RES(field_static_get_value); RES(class_get_type);
            RES(class_get_method_from_name); RES(runtime_invoke);
            RES(component_get_transform); RES(transform_get_position);
            RES(transform_get_rotation); RES(transform_set_rotation);
            RES(quaternion_look_rotation); RES(quaternion_slerp);
            RES(camera_get_main); RES(camera_world_to_screen_point);
            RES(transform_find); RES(transform_get_child);
            RES(transform_get_child_count); RES(string_new);
            RES(screen_get_width); RES(screen_get_height);
            p_method_from_name = p_class_get_method_from_name;
            p_screen_w = p_screen_get_width;
            p_screen_h = p_screen_get_height;
            if (!p_domain_get || !p_thread_attach || !p_class_from_name) return NO;
            void *dom = p_domain_get();
            if (!dom) return NO;
            p_thread_attach(dom);
            return YES;
          }

          static void *clsNS(const char *ns, const char *name) {
            uint32_t n = 0;
            void **asms = p_get_assemblies(p_domain_get(), &n);
            if (!asms) return NULL;
            for (uint32_t i = 0; i < n; i++) {
              void *img = p_assembly_image(asms[i]);
              if (!img) continue;
              void *c = p_class_from_name(img, ns, name);
              if (c) return c;
            }
            return NULL;
          }
          static void *cls(const char *n) { return clsNS("", n); }
          static size_t off(void *c, const char *f) {
            void *fi = c ? p_field_from_name(c, f) : NULL;
            return fi ? p_field_offset(fi) : 0;
          }
          static void *staticObj(void *c, const char *f) {
            void *fi = p_field_from_name(c, f);
            if (!fi) return NULL;
            void *v = NULL; p_field_static_get(fi, &v); return v;
          }
          static int readInt(void *o, size_t f) { return f ? *(int *)((char *)o + f) : -1; }
          static float readF(void *o, size_t f) { return f ? *(float *)((char *)o + f) : 1.0f; }
          static BOOL readB(void *o, size_t f) { return f ? *(BOOL *)((char *)o + f) : NO; }
          static float dist3(V3 a, V3 b) {
            float dx=a.x-b.x, dy=a.y-b.y, dz=a.z-b.z;
            return sqrtf(dx*dx+dy*dy+dz*dz);
          }

