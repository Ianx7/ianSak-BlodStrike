name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: theos
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          git clone --depth 1 --recursive https://github.com/theos/theos.git $HOME/theos

      - name: deps
        run: |
          brew install ldid
          brew install dpkg || true

      - name: fishhook
        continue-on-error: true
        run: |
          curl -fsSL -o fishhook.h https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.h || rm -f fishhook.h
          curl -fsSL -o fishhook.c https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.c || rm -f fishhook.c

      - name: files
        run: |
          mkdir -p layout/DEBIAN layout/Library/MobileSubstrate/DynamicLibraries
          cat > Makefile <<'EOF'
          TARGET := iphone:clang:latest:15.0
          ARCHS = arm64 arm64e
          THEOS_PACKAGE_SCHEME = rootless
          INSTALL_TARGET_PROCESSES = BloodStrike

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = libbs
          libbs_FILES = libbs.xm $(wildcard fishhook.c)
          libbs_CFLAGS = -fobjc-arc -O2 -fvisibility=hidden -Wno-everything
          libbs_FRAMEWORKS = UIKit Foundation QuartzCore
          libbs_INSTALL_PATH = /usr/lib
          libbs_LDFLAGS = -Wl,-dead_strip

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF
          cat > control <<'EOF'
          Package: com.apple.bsutil
          Name: BS Utils
          Version: 1.6.0
          Architecture: iphoneos-arm
          Description: utilidades varias
          Maintainer: ianSak
          Author: ianSak
          Section: Tweaks
          Depends: mobilesubstrate
          EOF
          cat > Filter.plist <<'EOF'
          { Filter = { Bundles = ( "com.netease.bloodstrike" ); }; }
          EOF
          cp control layout/DEBIAN/control
          cp Filter.plist layout/Library/MobileSubstrate/DynamicLibraries/libbs.plist

      - name: tweak
        run: |
          cat > libbs.xm <<'EOF'
          #import <UIKit/UIKit.h>
          #import <Foundation/Foundation.h>
          #import <objc/runtime.h>
          #import <dlfcn.h>
          #import <mach-o/dyld.h>
          #import <mach-o/loader.h>
          #import <sys/stat.h>
          #import <sys/types.h>
          #import <fcntl.h>
          #import <unistd.h>
          #import <dirent.h>
          #import <errno.h>
          #import <stdio.h>
          #import <stdlib.h>
          #import <string.h>
          #import <math.h>
          #import <pthread.h>
          #import <QuartzCore/QuartzCore.h>
          #if __has_include("fishhook.h")
          #import "fishhook.h"
          #define HAVE_FH 1
          #endif

          typedef struct { float x, y, z; } V3;
          typedef struct { float x, y, z, w; } Quat;
          typedef struct { CGPoint a, b; } Seg;

          static BOOL gAimbot = YES, gEsp = YES, gNpc = YES, gAnti = YES, gShowFov = YES, gReady = NO;
          static float gAimFov = 120.0f, gCamFov = 90.0f, gAimSpeed = 420.0f, gEspRange = 60.0f;

          static NSUserDefaults *defs(void) {
            static NSUserDefaults *d; static dispatch_once_t o;
            dispatch_once(&o, ^{ d = [[NSUserDefaults alloc] initWithSuiteName:@"com.apple.bsutil"]; });
            return d;
          }
          static void save(void) {
            NSUserDefaults *d = defs();
            [d setBool:gAimbot forKey:@"a"]; [d setBool:gEsp forKey:@"e"];
            [d setBool:gNpc forKey:@"n"]; [d setBool:gAnti forKey:@"t"];
            [d setBool:gShowFov forKey:@"f"]; [d setFloat:gAimFov forKey:@"af"];
            [d setFloat:gAimSpeed forKey:@"as"]; [d setFloat:gEspRange forKey:@"er"];
            [d synchronize];
          }
          static void load(void) {
            NSUserDefaults *d = defs();
            if ([d objectForKey:@"a"]) {
              gAimbot = [d boolForKey:@"a"]; gEsp = [d boolForKey:@"e"];
              gNpc = [d boolForKey:@"n"]; gAnti = [d boolForKey:@"t"];
              gShowFov = [d boolForKey:@"f"]; gAimFov = [d floatForKey:@"af"];
              gAimSpeed = [d floatForKey:@"as"]; gEspRange = [d floatForKey:@"er"];
            }
          }

          static const char *kHide[] = {
            "libbs.dylib", "com.apple.bsutil", "/var/jb", "/usr/lib/libsubstrate",
            "/usr/lib/libellekit", "/usr/lib/libhooker", "/usr/lib/TweakInject",
            "/Library/MobileSubstrate", "/usr/sbin/frida-server", "/usr/bin/cycript",
            "/.installed_unc0ver", "/var/lib/dpkg", "/private/var/lib/dpkg"
          };
          static BOOL hidden(const char *p) {
            if (!p) return NO;
            for (size_t i = 0; i < sizeof(kHide)/sizeof(kHide[0]); i++)
              if (strstr(p, kHide[i])) return YES;
            return NO;
          }
          static int (*o_stat)(const char *, struct stat *);
          static int (*o_lstat)(const char *, struct stat *);
          static int (*o_access)(const char *, int);
          static int (*o_open)(const char *, int, mode_t);
          static FILE *(*o_fopen)(const char *, const char *);
          static DIR *(*o_opendir)(const char *);
          static char *(*o_getenv)(const char *);
          static int h_stat(const char *p, struct stat *b) { if (hidden(p)) { errno = ENOENT; return -1; } return o_stat(p, b); }
          static int h_lstat(const char *p, struct stat *b) { if (hidden(p)) { errno = ENOENT; return -1; } return o_lstat(p, b); }
          static int h_access(const char *p, int m) { if (hidden(p)) { errno = ENOENT; return -1; } return o_access(p, m); }
          static int h_open(const char *p, int f, mode_t m) { if (hidden(p)) { errno = ENOENT; return -1; } return o_open(p, f, m); }
          static FILE *h_fopen(const char *p, const char *m) { if (hidden(p)) return NULL; return o_fopen(p, m); }
          static DIR *h_opendir(const char *p) { if (hidden(p)) return NULL; return o_opendir(p); }
          static char *h_getenv(const char *k) {
            if (k && !strcmp(k, "DYLD_INSERT_LIBRARIES")) return NULL;
            return o_getenv(k);
          }
          static void hideSelf(void) {
            int idx = -1;
            for (uint32_t i = 0; i < _dyld_image_count(); i++) {
              const char *n = _dyld_get_image_name(i);
              if (n && strstr(n, "libbs.dylib")) { idx = (int)i; break; }
            }
            if (idx < 0) return;
            const struct mach_header_64 *h = (const struct mach_header_64 *)_dyld_get_image_header(idx);
            if (!h) return;
            uintptr_t p = (uintptr_t)h + sizeof(*h);
            for (uint32_t i = 0; i < h->ncmds; i++) {
              struct load_command *lc = (struct load_command *)p;
              if (lc->cmd == LC_ID_DYLIB) {
                struct dylib_command *dc = (struct dylib_command *)lc;
                char *name = (char *)((uintptr_t)dc + dc->dylib.name.offset);
                if (strlen(name) >= 20) strcpy(name, "/usr/lib/libz.dylib");
                break;
              }
              p += lc->cmdsize;
            }
          }
          static void installAnti(void) {
            if (!gAnti) return;
            hideSelf();
          #ifdef HAVE_FH
            struct rebinding r[] = {
              { "stat", (void *)h_stat, (void **)&o_stat },
              { "lstat", (void *)h_lstat, (void **)&o_lstat },
              { "access", (void *)h_access, (void **)&o_access },
              { "open", (void *)h_open, (void **)&o_open },
              { "fopen", (void *)h_fopen, (void **)&o_fopen },
              { "opendir", (void *)h_opendir, (void **)&o_opendir },
              { "getenv", (void *)h_getenv, (void **)&o_getenv }
            };
            rebind_symbols(r, sizeof(r)/sizeof(r[0]));
          #endif
          }

          static void *(*p_domain_get)(void);
          static void *(*p_thread_attach)(void *);
          static void **(*p_domain_get_assemblies)(void *, uint32_t *);
          static void *(*p_assembly_get_image)(void *);
          static void *(*p_class_from_name)(void *, const char *, const char *);
          static void *(*p_class_get_field_from_name)(void *, const char *);
          static size_t (*p_field_get_offset)(void *);
          static void (*p_field_static_get_value)(void *, void *);
          static void *(*p_class_get_type)(void *);
          static void *(*p_class_get_method_from_name)(void *, const char *, int);
          static void *(*p_runtime_invoke)(void *, void *, void **, void **);
          static void *(*p_object_unbox)(void *);
          static void *(*p_string_new)(const char *);
          #define RES(x) p_##x = dlsym(RTLD_DEFAULT, "il2cpp_" #x)
          static BOOL resolveIl2Cpp(void) {
            RES(domain_get); RES(thread_attach); RES(domain_get_assemblies);
            RES(assembly_get_image); RES(class_from_name); RES(class_get_field_from_name);
            RES(field_get_offset); RES(field_static_get_value); RES(class_get_type);
            RES(class_get_method_from_name); RES(runtime_invoke);
            RES(object_unbox); RES(string_new);
            if (!p_domain_get || !p_thread_attach || !p_class_from_name) return NO;
            if (!p_class_get_method_from_name || !p_runtime_invoke || !p_object_unbox) return NO;
            void *dom = p_domain_get();
            if (!dom) return NO;
            p_thread_attach(dom);
            return YES;
          }
          static void *clsNS(const char *ns, const char *name) {
            uint32_t n = 0;
            void **asms = p_domain_get_assemblies(p_domain_get(), &n);
            if (!asms) return NULL;
            for (uint32_t i = 0; i < n; i++) {
              void *img = p_assembly_get_image(asms[i]);
              if (!img) continue;
              void *c = p_class_from_name(img, ns, name);
              if (c) return c;
            }
            return NULL;
          }
          static void *cls(const char *n) { return clsNS("", n); }
          static void *meth(void *k, const char *n, int c) { return k ? p_class_get_method_from_name(k, n, c) : NULL; }
          static void *invoke(void *m, void *obj, void **args) {
            if (!m) return NULL;
            void *exc = NULL;
            return p_runtime_invoke(m, obj, args, &exc);
          }
          static size_t off(void *c, const char *f) {
            void *fi = c ? p_class_get_field_from_name(c, f) : NULL;
            return fi ? p_field_get_offset(fi) : 0;
          }
          static void *staticObj(void *c, const char *f) {
            void *fi = c ? p_class_get_field_from_name(c, f) : NULL;
            if (!fi) return NULL;
            void *v = NULL; p_field_static_get_value(fi, &v); return v;
          }
          static int readInt(void *o, size_t f) { return f ? *(int *)((char *)o + f) : -1; }
          static float readF(void *o, size_t f) { return f ? *(float *)((char *)o + f) : 1.0f; }
          static BOOL readB(void *o, size_t f) { return f ? *(BOOL *)((char *)o + f) : NO; }
          static float dist3(V3 a, V3 b) { return sqrtf((a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y)+(a.z-b.z)*(a.z-b.z)); }

          static void *gCompCls, *gTransCls, *gCamCls, *gQuatCls, *gObjCls;
          static void *mCompTransform, *mGetPos, *mGetRot, *mSetRot, *mFind, *mGetChild, *mChildCount, *mCamMain, *mW2S, *mLookRot, *mSlerp;
          static void *compTransform(void *c) { return invoke(mCompTransform, c, NULL); }
          static V3 getPos(void *t) { void *r = invoke(mGetPos, t, NULL); return r ? *(V3 *)p_object_unbox(r) : (V3){0,0,0}; }
          static Quat getRot(void *t) { void *r = invoke(mGetRot, t, NULL); return r ? *(Quat *)p_object_unbox(r) : (Quat){0,0,0,1}; }
          static void setRot(void *t, Quat q) { void *a[1] = { &q }; invoke(mSetRot, t, a); }
          static void *camMain(void) { return invoke(mCamMain, NULL, NULL); }
          static V3 w2sRaw(void *cam, V3 wp) { void *a[1] = { &wp }; void *r = invoke(mW2S, cam, a); return r ? *(V3 *)p_object_unbox(r) : (V3){0,0,0}; }
          static void *findChild(void *t, const char *n) { void *a[1] = { p_string_new(n) }; return invoke(mFind, t, a); }
          static void *getChild(void *t, int i) { void *a[1] = { &i }; return invoke(mGetChild, t, a); }
          static int childCount(void *t) { void *r = invoke(mChildCount, t, NULL); return r ? *(int *)p_object_unbox(r) : 0; }
          static Quat lookRot(V3 d, V3 u) { void *a[2] = { &d, &u }; void *r = invoke(mLookRot, NULL, a); return r ? *(Quat *)p_object_unbox(r) : (Quat){0,0,0,1}; }
          static Quat slerpQ(Quat a, Quat b, float t) { void *ar[3] = { &a, &b, &t }; void *r = invoke(mSlerp, NULL, ar); return r ? *(Quat *)p_object_unbox(r) : a; }

          static const char *kPlayerCls[] = { "Player","PlayerController","BasePlayer","Character","Avatar","Actor","Entity" };
          static const char *kNpcCls[] = { "NPC","Bot","AIBot","Monster","Enemy" };
          static const char *kMgrCls[] = { "PlayerManager","GameManager","MatchManager" };
          static const char *kLocalSt[] = { "localPlayer","LocalPlayer","myPlayer","self" };
          static const char *kHead[] = { "Head","head","mixamorig:Head","Bip01 Head","Head_Jnt" };
          static const char *kNeck[] = { "Neck","neck","mixamorig:Neck","Bip01 Neck" };
          static const char *kChest[] = { "Chest","chest","UpperChest","mixamorig:Spine2","Spine" };
          static const char *kHips[] = { "Hips","hips","Pelvis","mixamorig:Hips" };
          static const char *kLH[] = { "LeftHand","hand_l","mixamorig:LeftHand" };
          static const char *kRH[] = { "RightHand","hand_r","mixamorig:RightHand" };
          static const char *kLF[] = { "LeftFoot","foot_l","mixamorig:LeftFoot" };
          static const char *kRF[] = { "RightFoot","foot_r","mixamorig:RightFoot" };

          static void *gPlayerCls, *gNpcCls, *gFindM, *gLocalCls;
          static size_t oTeam, oHp, oDead, oLocal1, oLocal2;
          static char gLocalF[32];

          static void *findBoneRec(void *t, const char *name, int depth) {
            if (!t || depth > 7) return NULL;
            void *r = findChild(t, name);
            if (r) return r;
            int n = childCount(t);
            for (int i = 0; i < n && i < 64; i++) {
              void *hit = findBoneRec(getChild(t, i), name, depth + 1);
              if (hit) return hit;
            }
            return NULL;
          }
          static void *findBone(void *root, const char **names, int c) {
            for (int i = 0; i < c; i++) { void *b = findBoneRec(root, names[i], 0); if (b) return b; }
            return NULL;
          }

          static NSMutableArray *gSegs, *gLabels;
          static UIView *gOverlay, *gFovCircle;
          static UIWindow *gWin;
          static void *gCache[256];
          static int gCacheN = 0;
          static double gLastScan = 0;

          static void *findAll(void *klass) {
            if (!gFindM || !klass) return NULL;
            void *a[1] = { p_class_get_type(klass) };
            return invoke(gFindM, NULL, a);
          }
          static void scan(void) {
            double now = CACurrentMediaTime();
            if (now - gLastScan < 0.25 && gCacheN) return;
            gLastScan = now; gCacheN = 0;
            if (!gPlayerCls) return;
            typedef struct { void *klass; void *mon; void *bounds; uint64_t len; void *v[1]; } Arr;
            Arr *a = (Arr *)findAll(gPlayerCls);
            if (a) for (uint64_t i = 0; i < a->len && gCacheN < 256; i++) gCache[gCacheN++] = a->v[i];
            if (gNpc && gNpcCls) {
              Arr *b = (Arr *)findAll(gNpcCls);
              if (b) for (uint64_t i = 0; i < b->len && gCacheN < 256; i++) gCache[gCacheN++] = b->v[i];
            }
          }
          static void *localPlayer(void) {
            if (gLocalCls && gLocalF[0]) { void *o = staticObj(gLocalCls, gLocalF); if (o) return o; }
            for (int i = 0; i < gCacheN; i++) {
              void *o = gCache[i];
              if (!o) continue;
              if (oLocal1 && readB(o, oLocal1)) return o;
              if (oLocal2 && readB(o, oLocal2)) return o;
            }
            return NULL;
          }
          static CGPoint w2sP(void *cam, V3 wp, CGFloat scale, BOOL *ok) {
            V3 sp = w2sRaw(cam, wp);
            *ok = (sp.z > 0.01f);
            return CGPointMake(sp.x / scale, sp.y / scale);
          }
          static float ang(V3 a, V3 b) {
            float d = a.x*b.x + a.y*b.y + a.z*b.z;
            float la = sqrtf(a.x*a.x+a.y*a.y+a.z*a.z), lb = sqrtf(b.x*b.x+b.y*b.y+b.z*b.z);
            if (la < 1e-5f || lb < 1e-5f) return 0;
            float c = d / (la*lb);
            if (c > 1) c = 1; if (c < -1) c = -1;
            return acosf(c) * 57.29578f;
          }

          static void tick(void) {
            if (!gReady || !mCompTransform) return;
            static double last = 0;
            double now = CACurrentMediaTime();
            float dt = last ? (float)(now - last) : 0.033f;
            if (dt > 0.2f) dt = 0.2f;
            last = now;
            [gSegs removeAllObjects]; [gLabels removeAllObjects];
            scan();
            void *cam = camMain();
            if (!cam) { [gOverlay setNeedsDisplay]; return; }
            void *camT = compTransform(cam);
            if (!camT) { [gOverlay setNeedsDisplay]; return; }
            V3 camPos = getPos(camT);
            Quat camRot = getRot(camT);
            void *local = localPlayer();
            if (local) { void *lt = compTransform(local); if (lt) camPos = getPos(lt); }
            int lteam = local ? readInt(local, oTeam) : -1;
            CGFloat scale = UIScreen.mainScreen.nativeScale;
            if (scale < 1.0) scale = 1.0;
            CGPoint center = CGPointMake(gOverlay.bounds.size.width / 2, gOverlay.bounds.size.height / 2);
            void *best = NULL; float bestD = 1e9f;
            for (int i = 0; i < gCacheN; i++) {
              void *e = gCache[i];
              if (!e || e == local) continue;
              if (oDead && readB(e, oDead)) continue;
              if (oHp && readF(e, oHp) <= 0.01f) continue;
              void *t = compTransform(e);
              if (!t) continue;
              float d = dist3(camPos, getPos(t));
              if (d > 200.0f) continue;
              BOOL enemy = YES;
              if (oTeam) { int tm = readInt(e, oTeam); if (tm != -1 && lteam != -1) enemy = (tm != lteam); }
              if (!enemy) continue;
              void *head = findBone(t, kHead, 5);
              if (!head) continue;
              BOOL ok = NO;
              CGPoint sp = w2sP(cam, getPos(head), scale, &ok);
              if (gAimbot && ok) {
                float sd = hypotf(sp.x - center.x, sp.y - center.y);
                if (sd < gAimFov && sd < bestD) { bestD = sd; best = e; }
              }
              if (gEsp && d <= gEspRange) {
                const char **nm[8] = { kHead, kNeck, kChest, kHips, kLH, kRH, kLF, kRF };
                int cnt[8] = { 5, 4, 5, 4, 3, 3, 3, 3 };
                CGPoint pts[8]; BOOL okp[8];
                for (int b = 0; b < 8; b++) {
                  void *bt = findBone(t, nm[b], cnt[b]);
                  okp[b] = NO;
                  if (!bt) continue;
                  pts[b] = w2sP(cam, getPos(bt), scale, &okp[b]);
                }
                int pr[8][2] = {{0,1},{1,2},{2,3},{3,6},{3,7},{2,4},{2,5},{0,3}};
                for (int k = 0; k < 8; k++) {
                  int a1 = pr[k][0], b1 = pr[k][1];
                  if (!okp[a1] || !okp[b1]) continue;
                  Seg s; s.a = pts[a1]; s.b = pts[b1];
                  [gSegs addObject:[NSValue valueWithBytes:&s objCType:@encode(Seg)]];
                }
                [gLabels addObject:[NSValue valueWithBytes:&sp objCType:@encode(CGPoint)]];
              }
            }
            if (gAimbot && best) {
              void *bt = compTransform(best);
              void *head = bt ? findBone(bt, kHead, 5) : NULL;
              if (head) {
                V3 tp = getPos(head);
                tp.x += ((rand() % 100) - 50) * 0.0004f;
                tp.y += ((rand() % 100) - 50) * 0.0004f;
                tp.z += ((rand() % 100) - 50) * 0.0004f;
                V3 dir = (V3){ tp.x - camPos.x, tp.y - camPos.y, tp.z - camPos.z };
                V3 up = (V3){0,1,0};
                if (fabsf(dir.x) < 0.01f && fabsf(dir.z) < 0.01f) up = (V3){0,0,1};
                float dAng = ang((V3){0,0,-1}, dir);
                float step = gAimSpeed * dt;
                float k = (dAng > 0.01f) ? MIN(1.0f, step / dAng) : 1.0f;
                setRot(camT, slerpQ(camRot, lookRot(dir, up), k));
              }
            }
            [gOverlay setNeedsDisplay];
          }

          @interface _BSOverlay : UIView @end
          @implementation _BSOverlay
          - (void)drawRect:(CGRect)r {
            CGContextRef c = UIGraphicsGetCurrentContext();
            CGContextSetLineWidth(c, 1.4);
            CGContextSetStrokeColorWithColor(c, [UIColor redColor].CGColor);
            for (NSValue *v in gSegs) {
              Seg s; [v getValue:&s];
              CGContextMoveToPoint(c, s.a.x, s.a.y);
              CGContextAddLineToPoint(c, s.b.x, s.b.y);
              CGContextStrokePath(c);
            }
          }
          @end

          @interface _BSWin : UIWindow @end
          @implementation _BSWin
          - (UIView *)hitTest:(CGPoint)p withEvent:(UIEvent *)e {
            UIView *v = [super hitTest:p withEvent:e];
            return v == self.rootViewController.view ? nil : v;
          }
          @end

          @interface _BSMenu : UIViewController
          @property (nonatomic, strong) UIView *panel;
          @property (nonatomic, strong) UIButton *fab;
          @property (nonatomic, strong) CADisplayLink *link;
          - (void)frame:(CADisplayLink *)l;
          @end

          @implementation _BSMenu
          - (void)frame:(CADisplayLink *)l { tick(); }

          - (UISwitch *)row:(CGFloat)y t:(NSString *)t on:(BOOL)on act:(SEL)a {
            UISwitch *s = [[UISwitch alloc] initWithFrame:CGRectMake(12, y, 51, 31)];
            s.on = on; s.onTintColor = [UIColor redColor];
            [s addTarget:self action:a forControlEvents:UIControlEventValueChanged];
            [self.panel addSubview:s];
            UILabel *l = [[UILabel alloc] initWithFrame:CGRectMake(72, y + 5, 180, 20)];
            l.text = t; l.textColor = [UIColor whiteColor]; l.font = [UIFont systemFontOfSize:13];
            [self.panel addSubview:l];
            return s;
          }
          - (void)cap:(CGFloat)y t:(NSString *)t {
            UILabel *l = [[UILabel alloc] initWithFrame:CGRectMake(12, y, 236, 18)];
            l.text = t; l.textColor = [UIColor lightGrayColor]; l.font = [UIFont systemFontOfSize:11];
            [self.panel addSubview:l];
          }
          - (void)sld:(CGFloat)y lo:(float)lo hi:(float)hi v:(float)v act:(SEL)a {
            UISlider *s = [[UISlider alloc] initWithFrame:CGRectMake(12, y, 236, 28)];
            s.minimumValue = lo; s.maximumValue = hi; s.value = v;
            [s addTarget:self action:a forControlEvents:UIControlEventValueChanged];
            [self.panel addSubview:s];
          }

          - (void)viewDidLoad {
            [super viewDidLoad];
            self.view.backgroundColor = [UIColor clearColor];
            gSegs = [NSMutableArray array]; gLabels = [NSMutableArray array];
            gOverlay = [[_BSOverlay alloc] initWithFrame:self.view.bounds];
            gOverlay.backgroundColor = [UIColor clearColor];
            gOverlay.userInteractionEnabled = NO;
            [self.view addSubview:gOverlay];
            gFovCircle = [[UIView alloc] initWithFrame:CGRectMake(0, 0, gAimFov * 2, gAimFov * 2)];
            gFovCircle.center = self.view.center;
            gFovCircle.layer.borderColor = [UIColor redColor].CGColor;
            gFovCircle.layer.borderWidth = 2;
            gFovCircle.layer.cornerRadius = gAimFov;
            gFovCircle.hidden = !gShowFov;
            gFovCircle.userInteractionEnabled = NO;
            [self.view addSubview:gFovCircle];
            _fab = [UIButton buttonWithType:UIButtonTypeSystem];
            _fab.frame = CGRectMake(12, 120, 54, 54);
            _fab.backgroundColor = [[UIColor blackColor] colorWithAlphaComponent:0.7];
            _fab.layer.cornerRadius = 27;
            [_fab setTitle:@"iS" forState:UIControlStateNormal];
            [_fab setTitleColor:[UIColor redColor] forState:UIControlStateNormal];
            [_fab addTarget:self action:@selector(tap) forControlEvents:UIControlEventTouchUpInside];
            [_fab addGestureRecognizer:[[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(pan:)]];
            [self.view addSubview:_fab];
            _panel = [[UIView alloc] initWithFrame:CGRectMake(12, 184, 260, 470)];
            _panel.backgroundColor = [[UIColor blackColor] colorWithAlphaComponent:0.9];
            _panel.layer.cornerRadius = 14;
            _panel.hidden = YES;
            [self.view addSubview:_panel];
            UILabel *t = [[UILabel alloc] initWithFrame:CGRectMake(12, 8, 240, 20)];
            t.text = @"iS — BLOOD STRIKE"; t.textColor = [UIColor redColor];
            t.font = [UIFont boldSystemFontOfSize:14];
            [_panel addSubview:t];
            [self row:36 t:@"Aimbot (cabeza)" on:gAimbot act:@selector(a1:)];
            [self row:72 t:@"ESP esqueleto" on:gEsp act:@selector(a2:)];
            [self row:108 t:@"NPCs" on:gNpc act:@selector(a3:)];
            [self row:144 t:@"Anti-deteccion" on:gAnti act:@selector(a4:)];
            [self row:180 t:@"Mostrar FOV" on:gShowFov act:@selector(a5:)];
            [self cap:216 t:[NSString stringWithFormat:@"FOV aim: %.0f", gAimFov]];
            [self sld:236 lo:30 hi:250 v:gAimFov act:@selector(f1:)];
            [self cap:274 t:@"Velocidad aim"];
            [self sld:296 lo:60 hi:900 v:gAimSpeed act:@selector(f2:)];
            [self cap:334 t:[NSString stringWithFormat:@"Rango ESP: %.0fm", gEspRange]];
            [self sld:356 lo:10 hi:200 v:gEspRange act:@selector(f3:)];
          }
          - (void)tap { _panel.hidden = !_panel.hidden; }
          - (void)pan:(UIPanGestureRecognizer *)g {
            CGPoint p = [g translationInView:self.view];
            _fab.center = CGPointMake(_fab.center.x + p.x, _fab.center.y + p.y);
            [g setTranslation:CGPointZero inView:self.view];
            _panel.frame = CGRectMake(_fab.frame.origin.x, _fab.frame.origin.y + 64, 260, 470);
          }
          - (void)a1:(UISwitch *)s { gAimbot = s.on; save(); }
          - (void)a2:(UISwitch *)s { gEsp = s.on; save(); }
          - (void)a3:(UISwitch *)s { gNpc = s.on; save(); }
          - (void)a4:(UISwitch *)s { gAnti = s.on; save(); }
          - (void)a5:(UISwitch *)s { gShowFov = s.on; gFovCircle.hidden = !s.on; save(); }
          - (void)f1:(UISlider *)s {
            gAimFov = s.value;
            gFovCircle.frame = CGRectMake(0, 0, gAimFov * 2, gAimFov * 2);
            gFovCircle.center = self.view.center;
            gFovCircle.layer.cornerRadius = gAimFov;
            save();
          }
          - (void)f2:(UISlider *)s { gAimSpeed = s.value; save(); }
          - (void)f3:(UISlider *)s { gEspRange = s.value; save(); }
          @end

          static void *boot(void *arg) {
            for (int i = 0; i < 900; i++) { if (resolveIl2Cpp()) break; usleep(100000); }
            if (!p_domain_get || !p_domain_get()) return NULL;
            gCompCls = clsNS("UnityEngine", "Component");
            gTransCls = clsNS("UnityEngine", "Transform");
            gCamCls = clsNS("UnityEngine", "Camera");
            gQuatCls = clsNS("UnityEngine", "Quaternion");
            gObjCls = clsNS("UnityEngine", "Object");
            mCompTransform = meth(gCompCls, "get_transform", 0);
            mGetPos = meth(gTransCls, "get_position", 0);
            mGetRot = meth(gTransCls, "get_rotation", 0);
            mSetRot = meth(gTransCls, "set_rotation", 1);
            mFind = meth(gTransCls, "Find", 1);
            mGetChild = meth(gTransCls, "GetChild", 1);
            mChildCount = meth(gTransCls, "get_childCount", 0);
            mCamMain = meth(gCamCls, "get_main", 0);
            mW2S = meth(gCamCls, "WorldToScreenPoint", 1);
            mLookRot = meth(gQuatCls, "LookRotation", 2);
            mSlerp = meth(gQuatCls, "Slerp", 3);
            gFindM = meth(gObjCls, "FindObjectsOfType", 1);
            for (int i = 0; i < 7 && !gPlayerCls; i++) gPlayerCls = cls(kPlayerCls[i]);
            if (!gPlayerCls) return NULL;
            for (int i = 0; i < 5 && !gNpcCls; i++) gNpcCls = cls(kNpcCls[i]);
            oTeam = off(gPlayerCls, "team"); if (!oTeam) oTeam = off(gPlayerCls, "teamId");
            oHp = off(gPlayerCls, "hp"); if (!oHp) oHp = off(gPlayerCls, "health");
            oDead = off(gPlayerCls, "isDead"); if (!oDead) oDead = off(gPlayerCls, "dead");
            oLocal1 = off(gPlayerCls, "isLocalPlayer");
            oLocal2 = off(gPlayerCls, "isMine");
            for (int i = 0; i < 3 && !gLocalCls; i++) {
              void *m = cls(kMgrCls[i]);
              if (!m) continue;
              for (int j = 0; j < 4; j++) {
                if (p_class_get_field_from_name(m, kLocalSt[j])) {
                  gLocalCls = m;
                  strlcpy(gLocalF, kLocalSt[j], sizeof(gLocalF));
                  break;
                }
              }
            }
            gReady = YES;
            dispatch_async(dispatch_get_main_queue(), ^{
              UIWindowScene *sc = nil;
              for (UIScene *s in UIApplication.sharedApplication.connectedScenes)
                if ([s isKindOfClass:[UIWindowScene class]]) { sc = (UIWindowScene *)s; break; }
              gWin = sc ? [[_BSWin alloc] initWithWindowScene:sc] : [[_BSWin alloc] initWithFrame:UIScreen.mainScreen.bounds];
              gWin.windowLevel = UIWindowLevelAlert + 1;
              gWin.backgroundColor = [UIColor clearColor];
              _BSMenu *m = [_BSMenu new];
              gWin.rootViewController = m;
              [gWin makeKeyAndVisible];
              m.link = [CADisplayLink displayLinkWithTarget:m selector:@selector(frame:)];
              m.link.preferredFramesPerSecond = 30;
              [m.link addToRunLoop:NSRunLoop.mainRunLoop forMode:NSRunLoopCommonModes];
            });
            return NULL;
          }

          __attribute__((constructor))
          static void bsInit(void) {
            load();
            installAnti();
            pthread_t th;
            pthread_create(&th, NULL, boot, NULL);
            pthread_detach(th);
          }
          EOF

      - name: build
        run: |
          set -o pipefail
          make package FINALPACKAGE=1 DEBUG=0 STRIP=1 2>&1 | tee build.log

      - name: errores
        if: failure()
        run: grep -n -m 60 -E "error:|undefined|ld: |fatal" build.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: deb
          path: packages/*.deb
