// --- Estructuras Básicas ---
typedef struct {
    float x, y, z;
} Vector3;

typedef struct {
    float x, y;
} Vector2;

// --- Configuración Global ---
@interface Config : NSObject
@property (nonatomic, assign) BOOL enabled;
@property (nonatomic, assign) BOOL aimbot;
@property (nonatomic, assign) BOOL esp;
@property (nonatomic, assign) BOOL npcOnly;
@property (nonatomic, assign) float fov;
@property (nonatomic, assign) float smooth;
@property (nonatomic, assign) float drawDistance;
@end

static Config *gConfig = nil;
static BOOL isPanelVisible = NO;
static UIWindow *overlayWindow = nil;
static UIView *menuView = nil;

// --- Gestión de Memoria para Config ---
@implementation Config
+ (instancetype)sharedInstance {
    static dispatch_once_t onceToken;
    static Config *instance = nil;
    dispatch_once(&onceToken, ^{
        instance = [[self alloc] init];
        // Valores por defecto
        instance.enabled = YES;
        instance.aimbot = YES;
        instance.esp = YES;
        instance.npcOnly = NO;
        instance.fov = 90.0f;
        instance.smooth = 10.0f;
        instance.drawDistance = 100.0f;
        
        // Cargar preferencias guardadas
        NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
        if ([defaults boolForKey:@"bs_enabled"]) instance.enabled = [defaults boolForKey:@"bs_enabled"];
        if ([defaults boolForKey:@"bs_aimbot"]) instance.aimbot = [defaults boolForKey:@"bs_aimbot"];
        if ([defaults boolForKey:@"bs_esp"]) instance.esp = [defaults boolForKey:@"bs_esp"];
        if ([defaults boolForKey:@"bs_npc"]) instance.npcOnly = [defaults boolForKey:@"bs_npc"];
        if ([defaults floatForKey:@"bs_fov"]) instance.fov = [defaults floatForKey:@"bs_fov"];
        if ([defaults floatForKey:@"bs_smooth"]) instance.smooth = [defaults floatForKey:@"bs_smooth"];
        if ([defaults floatForKey:@"bs_dist"]) instance.drawDistance = [defaults floatForKey:@"bs_dist"];
    });
    return instance;
}

- (void)save {
    NSUserDefaults *defaults = [NSUserDefaults standardUserDefaults];
    [defaults setBool:self.enabled forKey:@"bs_enabled"];
    [defaults setBool:self.aimbot forKey:@"bs_aimbot"];
    [defaults setBool:self.esp forKey:@"bs_esp"];
    [defaults setBool:self.npcOnly forKey:@"bs_npc"];
    [defaults setFloat:self.fov forKey:@"bs_fov"];
    [defaults setFloat:self.smooth forKey:@"bs_smooth"];
    [defaults setFloat:self.drawDistance forKey:@"bs_dist"];
    [defaults synchronize];
}
@end

// --- UI: Panel ianSak ---
@interface MenuContainer : UIView
@end

@implementation MenuContainer

- (instancetype)initWithFrame:(CGRect)frame {
    self = [super initWithFrame:frame];
    if (self) {
        self.backgroundColor = [[UIColor blackColor] colorWithAlphaComponent:0.85];
        self.layer.cornerRadius = 12;
        self.clipsToBounds = YES;
        
        // Título
        UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(0, 10, frame.size.width, 30)];
        title.text = @"ianSak v1.0";
        title.font = [UIFont boldSystemFontOfSize:18];
        title.textColor = [UIColor whiteColor];
        title.textAlignment = NSTextAlignmentCenter;
        [self addSubview:title];
        
        // Separador
        UIView *sep = [[UIView alloc] initWithFrame:CGRectMake(10, 45, frame.size.width - 20, 1)];
        sep.backgroundColor = [UIColor grayColor];
        [self addSubview:sep];
        
        // Slider FOV
        UISlider *fovSlider = [[UISlider alloc] initWithFrame:CGRectMake(10, 55, frame.size.width - 20, 30)];
        fovSlider.minimumValue = 10.0f;
        fovSlider.maximumValue = 180.0f;
        fovSlider.value = gConfig.fov;
        [fovSlider addTarget:[Config sharedInstance] action:@selector(updateFov:) forControlEvents:UIControlEventValueChanged];
        [self addSubview:fovSlider];
        
        UILabel *fovLabel = [[UILabel alloc] initWithFrame:CGRectMake(10, 90, frame.size.width - 20, 20)];
        fovLabel.text = [NSString stringWithFormat:@"FOV: %.0f", gConfig.fov];
        fovLabel.textColor = [UIColor lightGrayColor];
        [self addSubview:fovLabel];
        
        // Botones Toggle
        [self addButtonWithTitle:@"Aimbot" key:@"aimbot" x:10 y:120 width:frame.size.width - 20];
        [self addButtonWithTitle:@"ESP Skeleton" key:@"esp" x:10 y:160 width:frame.size.width - 20];
        [self addButtonWithTitle:@"NPC Only" key:@"npc" x:10 y:200 width:frame.size.width - 20];
    }
    return self;
}

- (void)updateFov:(id)sender {
    UISlider *slider = (UISlider *)sender;
    gConfig.fov = slider.value;
    [gConfig save];
    
    // Actualizar label
    for (UIView *subview in self.subviews) {
        if ([subview isKindOfClass:[UILabel class]]) {
            subview.text = [NSString stringWithFormat:@"FOV: %.0f", gConfig.fov];
        }
    }
}

- (void)addButtonWithTitle:(NSString *)title key:(NSString *)key x:(CGFloat)x y:(CGFloat)y width:(CGFloat)width {
    UILabel *label = [[UILabel alloc] initWithFrame:CGRectMake(x, y, width - 80, 30)];
    label.text = title;
    label.textColor = [UIColor whiteColor];
    [self addSubview:label];
    
    UIButton *btn = [UIButton buttonWithType:UIButtonTypeSystem];
    btn.frame = CGRectMake(x + width - 75, y, 70, 30);
    [btn setTitle:@"ON" forState:UIControlStateNormal];
    [btn setTitleColor:[UIColor greenColor] forState:UIControlStateNormal];
    [btn setBackgroundColor:[UIColor darkGrayColor]];
    btn.layer.cornerRadius = 5;
    [btn addTarget:self action:@selector(toggleAction:key:) forControlEvents:UIControlEventTouchUpInside];
    [self addSubview:btn];
}

- (void)toggleAction:(id)sender key:(NSString *)key {
    Config *config = [Config sharedInstance];
    BOOL newValue = NO;
    
    if ([key isEqualToString:@"aimbot"]) {
        config.aimbot = !config.aimbot;
        newValue = config.aimbot;
    } else if ([key isEqualToString:@"esp"]) {
        config.esp = !config.esp;
        newValue = config.esp;
    } else if ([key isEqualToString:@"npc"]) {
        config.npcOnly = !config.npcOnly;
        newValue = config.npcOnly;
    }
    
    [config save];
    
    // Actualizar UI del botón
    UIButton *btn = (UIButton *)sender;
    [btn setTitle:newValue ? @"ON" : @"OFF" forState:UIControlStateNormal];
    [btn setTitleColor:newValue ? [UIColor greenColor] : [UIColor redColor] forState:UIControlStateNormal];
}

@end

// --- Detección de Gestos (Triple Tap con 3 Dedos) ---
%hook UIApplication
- (void)sendEvent:(UIEvent *)event {
    %orig;
    
    if (event.type == UIEventTypeTouches) {
        NSSet *touches = event.touches;
        NSUInteger count = touches.count;
        
        // Solo procesamos si hay EXACTAMENTE 3 toques finales
        if (count == 3) {
            UITouchPhase phase = [[touches anyObject] phase];
            
            if (phase == UITouchPhaseEnded) {
                // Triple toque con 3 dedos detectado
                isPanelVisible = !isPanelVisible;
                
                if (isPanelVisible) {
                    [self showPanel];
                } else {
                    [self hidePanel];
                }
            }
        }
    }
}
%end

%extension UIApplication
- (void)showPanel {
    if (!overlayWindow) {
        overlayWindow = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
        overlayWindow.windowLevel = UIWindowLevelAlert + 1;
        overlayWindow.backgroundColor = [UIColor clearColor];
        overlayWindow.userInteractionEnabled = YES;
        
        menuView = [[MenuContainer alloc] initWithFrame:CGRectMake(20, 100, 200, 250)];
        [overlayWindow addSubview:menuView];
        
        overlayWindow.hidden = NO;
    } else {
        overlayWindow.hidden = NO;
    }
}

- (void)hidePanel {
    if (overlayWindow) {
        overlayWindow.hidden = YES;
    }
}
%end

