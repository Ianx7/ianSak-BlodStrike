name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: theos
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          git clone --recursive https://github.com/theos/theos.git $HOME/theos

      - name: instalar ldid
        run: brew install ldid

      - name: crear archivos
        run: |
          cat > ianSak.m <<'EOF'
          // ianSak.m — Blood Strike Panel + FOV
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>

          static BOOL gAimbot = YES;
          static BOOL gESP = YES;
          static BOOL gNoRecoil = YES;
          static BOOL gShowFov = YES;
          static float gAimFov = 120.0f;
          static float gCamFov = 90.0f;
          static float gSmooth = 4.0f;
          static UIWindow *gWin;

          static void save() {
              NSUserDefaults *d = [NSUserDefaults standardUserDefaults];
              [d setBool:gAimbot forKey:@"ianSak.aimbot"];
              [d setBool:gESP forKey:@"ianSak.esp"];
              [d setBool:gNoRecoil forKey:@"ianSak.norecoil"];
              [d setBool:gShowFov forKey:@"ianSak.showfov"];
              [d setFloat:gAimFov forKey:@"ianSak.aimfov"];
              [d setFloat:gCamFov forKey:@"ianSak.camfov"];
              [d setFloat:gSmooth forKey:@"ianSak.smooth"];
          }

          @interface PassWin : UIWindow @end
          @implementation PassWin
          - (UIView *)hitTest:(CGPoint)p withEvent:(UIEvent *)e {
              UIView *v = [super hitTest:p withEvent:e];
              return v == self.rootViewController.view ? nil : v;
          }
          @end

          @interface MenuVC : UIViewController
          @property (nonatomic, strong) UIView *panel;
          @property (nonatomic, strong) UIButton *fab;
          @property (nonatomic, strong) UILabel *fovLabel;
          @property (nonatomic, strong) UILabel *camLabel;
          @property (nonatomic, strong) UIView *fovCircle;
          @end

          @implementation MenuVC
          - (UIView *)makeRow:(CGFloat)y title:(NSString *)title on:(BOOL)on action:(SEL)act {
              UISwitch *sw = [[UISwitch alloc] initWithFrame:CGRectMake(12, y, 51, 31)];
              sw.on = on; sw.onTintColor = [UIColor redColor];
              [sw addTarget:self action:act forControlEvents:UIControlEventValueChanged];
              [self.panel addSubview:sw];
              UILabel *l = [[UILabel alloc] initWithFrame:CGRectMake(72, y+5, 170, 20)];
              l.text = title; l.textColor = [UIColor whiteColor]; l.font = [UIFont systemFontOfSize:13];
              [self.panel addSubview:l];
              return sw;
          }
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor clearColor];
              // Circulo FOV en el centro
              _fovCircle = [[UIView alloc] initWithFrame:CGRectMake(0,0,gAimFov*1.2,gAimFov*1.2)];
              _fovCircle.center = self.view.center;
              _fovCircle.layer.borderColor = [UIColor redColor].CGColor;
              _fovCircle.layer.borderWidth = 2;
              _fovCircle.layer.cornerRadius = gAimFov*0.6;
              _fovCircle.hidden = !gShowFov;
              _fovCircle.userInteractionEnabled = NO;
              [self.view addSubview:_fovCircle];

              _fab = [UIButton buttonWithType:UIButtonTypeSystem];
              _fab.frame = CGRectMake(12, 120, 54, 54);
              _fab.backgroundColor = [[UIColor blackColor] colorWithAlphaComponent:0.75];
              _fab.layer.cornerRadius = 27;
              [_fab setTitle:@"iS" forState:UIControlStateNormal];
              [_fab setTitleColor:[UIColor redColor] forState:UIControlStateNormal];
              [_fab addTarget:self action:@selector(tap) forControlEvents:UIControlEventTouchUpInside];
              [_fab addGestureRecognizer:[[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(pan:)]];
              [self.view addSubview:_fab];

              _panel = [[UIView alloc] initWithFrame:CGRectMake(12, 184, 260, 380)];
              _panel.backgroundColor = [[UIColor blackColor] colorWithAlphaComponent:0.9];
              _panel.layer.cornerRadius = 14;
              _panel.hidden = YES;
              [self.view addSubview:_panel];

              UILabel *t = [[UILabel alloc] initWithFrame:CGRectMake(12, 8, 240, 20)];
              t.text = @"ianSak — BLOOD STRIKE"; t.textColor = [UIColor redColor]; t.font = [UIFont boldSystemFontOfSize:14];
              [_panel addSubview:t];

              [self makeRow:36 title:@"Aimbot" on:gAimbot action:@selector(a1:)];
              [self makeRow:72 title:@"ESP / Wallhack" on:gESP action:@selector(a2:)];
              [self makeRow:108 title:@"Sin Retroceso" on:gNoRecoil action:@selector(a3:)];
              [self makeRow:144 title:@"Mostrar Circulo FOV" on:gShowFov action:@selector(a4:)];

              _fovLabel = [[UILabel alloc] initWithFrame:CGRectMake(12, 188, 236, 20)];
              _fovLabel.text = [NSString stringWithFormat:@"Aim FOV: %.0f", gAimFov];
              _fovLabel.textColor = [UIColor lightGrayColor]; _fovLabel.font = [UIFont systemFontOfSize:12];
              [_panel addSubview:_fovLabel];
              UISlider *s1 = [[UISlider alloc] initWithFrame:CGRectMake(12, 210, 236, 30)];
              s1.minimumValue=30; s1.maximumValue=250; s1.value=gAimFov;
              [s1 addTarget:self action:@selector(fovChanged:) forControlEvents:UIControlEventValueChanged];
              [_panel addSubview:s1];

              _camLabel = [[UILabel alloc] initWithFrame:CGRectMake(12, 248, 236, 20)];
              _camLabel.text = [NSString stringWithFormat:@"Camara FOV: %.0f°", gCamFov];
              _camLabel.textColor = [UIColor lightGrayColor]; _camLabel.font = [UIFont systemFontOfSize:12];
              [_panel addSubview:_camLabel];
              UISlider *s2 = [[UISlider alloc] initWithFrame:CGRectMake(12, 270, 236, 30)];
              s2.minimumValue=60; s2.maximumValue=130; s2.value=gCamFov;
              [s2 addTarget:self action:@selector(camChanged:) forControlEvents:UIControlEventValueChanged];
              [_panel addSubview:s2];

              UILabel *sm = [[UILabel alloc] initWithFrame:CGRectMake(12, 308, 236, 20)];
              sm.text = @"Suavidad Aim"; sm.textColor = [UIColor lightGrayColor]; sm.font = [UIFont systemFontOfSize:12];
              [_panel addSubview:sm];
              UISlider *s3 = [[UISlider alloc] initWithFrame:CGRectMake(12, 330, 236, 30)];
              s3.minimumValue=1; s3.maximumValue=10; s3.value=gSmooth;
              [s3 addTarget:self action:@selector(smChanged:) forControlEvents:UIControlEventValueChanged];
              [_panel addSubview:s3];
          }
          - (void)tap { _panel.hidden = !_panel.hidden; }
          - (void)pan:(UIPanGestureRecognizer *)g {
              CGPoint p = [g translationInView:self.view];
              _fab.center = CGPointMake(_fab.center.x + p.x, _fab.center.y + p.y);
              [g setTranslation:CGPointZero inView:self.view];
              _panel.frame = CGRectMake(_fab.frame.origin.x, _fab.frame.origin.y + 64, 260, 380);
          }
          - (void)a1:(UISwitch *)s { gAimbot=s.on; save(); }
          - (void)a2:(UISwitch *)s { gESP=s.on; save(); }
          - (void)a3:(UISwitch *)s { gNoRecoil=s.on; save(); }
          - (void)a4:(UISwitch *)s { gShowFov=s.on; _fovCircle.hidden=!s.on; save(); }
          - (void)fovChanged:(UISlider *)s {
              gAimFov=s.value;
              _fovLabel.text=[NSString stringWithFormat:@"Aim FOV: %.0f", gAimFov];
              _fovCircle.frame=CGRectMake(0,0,gAimFov*1.2,gAimFov*1.2);
              _fovCircle.center=self.view.center;
              _fovCircle.layer.cornerRadius=gAimFov*0.6;
              save();
          }
          - (void)camChanged:(UISlider *)s { gCamFov=s.value; _camLabel.text=[NSString stringWithFormat:@"Camara FOV: %.0f°", gCamFov]; save(); }
          - (void)smChanged:(UISlider *)s { gSmooth=s.value; save(); }
          @end

          __attribute__((constructor)) static void init(void) {
              NSUserDefaults *d = [NSUserDefaults standardUserDefaults];
              gAimbot = [d objectForKey:@"ianSak.aimbot"] ? [d boolForKey:@"ianSak.aimbot"] : YES;
              gESP = [d objectForKey:@"ianSak.esp"] ? [d boolForKey:@"ianSak.esp"] : YES;
              gNoRecoil = [d objectForKey:@"ianSak.norecoil"] ? [d boolForKey:@"ianSak.norecoil"] : YES;
              gShowFov = [d objectForKey:@"ianSak.showfov"] ? [d boolForKey:@"ianSak.showfov"] : YES;
              float a=[d floatForKey:@"ianSak.aimfov"]; if(a>0) gAimFov=a;
              float c=[d floatForKey:@"ianSak.camfov"]; if(c>0) gCamFov=c;
              float s=[d floatForKey:@"ianSak.smooth"]; if(s>0) gSmooth=s;
              [[NSNotificationCenter defaultCenter] addObserverForName:UIApplicationDidFinishLaunchingNotification object:nil queue:[NSOperationQueue mainQueue] usingBlock:^(NSNotification *n) {
                  gWin = [[PassWin alloc] initWithFrame:[UIScreen mainScreen].bounds];
                  gWin.windowLevel = UIWindowLevelAlert + 1;
                  gWin.backgroundColor = [UIColor clearColor];
                  gWin.rootViewController = [MenuVC new];
                  [gWin makeKeyAndVisible];
              }];
          }
          EOF

          cat > Makefile <<'EOF'
          TARGET := iphone:clang:latest:15.0
          ARCHS = arm64
          include $(THEOS)/makefiles/common.mk
          TWEAK_NAME = ianSak
          ianSak_FILES = ianSak.m
          ianSak_FRAMEWORKS = UIKit Foundation
          include $(THEOS)/makefiles/tweak.mk
          EOF

          cat > control <<'EOF'
          Package: com.iansak.bloodstrike
          Name: ianSak
          Version: 1.0
          Architecture: iphoneos-arm
          Description: Panel Blood Strike + FOV
          Maintainer: ianSak
          EOF

          cat > ianSak.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Filter</key>
              <dict>
                  <key>Bundles</key>
                  <array>
                      <string>com.netease.BloodStrike</string>
                  </array>
              </dict>
          </dict>
          </plist>
          EOF

      - name: build
        run: make package FINALPACKAGE=1

      - name: buscar archivos
        run: find .theos -type f | head -n 100

      - uses: actions/upload-artifact@v4
        with:
          name: ianSak-dylib
          path: |
            .theos/obj/**/*.dylib
            .theos/packages/*.deb
            .theos/obj/debug/ianSak.dylib
          if-no-files-found: warn
