name: Compilar ianSakPanel

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Instalar Theos
        run: |
          git clone --recursive https://github.com $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Generar Makefile y Tweak.xm
        run: |
          cat > Makefile <<'EOF'
          TARGET := iphone:clang:latest:15.0
          ARCHS = arm64
          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = ianSakPanel
          ianSakPanel_FILES = Tweak.xm
          ianSakPanel_CFLAGS = -fobjc-arc -O2 -Wno-everything
          ianSakPanel_FRAMEWORKS = UIKit Foundation WebKit

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF

          cat > Tweak.xm <<'EOF'
          #import <UIKit/UIKit.h>
          #import <Foundation/Foundation.h>
          #import <WebKit/WebKit.h>

          @interface PassThroughWindow : UIWindow
          @end

          @implementation PassThroughWindow
          - (UIView *)hitTest:(CGPoint)point withEvent:(UIEvent *)event {
              UIView *hitView = [super hitTest:point withEvent:event];
              return (hitView == self.rootViewController.view) ? nil : hitView;
          }
          @end

          @interface PanelViewController : UIViewController <WKScriptMessageHandler, UIGestureRecognizerDelegate>
          @property (nonatomic, strong) UIView *containerView;
          @property (nonatomic, strong) WKWebView *webView;
          @end

          @implementation PanelViewController

          - (NSURL *)configFileURL {
              NSFileManager *fm = [NSFileManager defaultManager];
              NSURL *docs = [[fm URLsForDirectory:NSDocumentDirectory inDomains:NSUserDomainMask] firstObject];
              return [docs URLByAppendingPathComponent:@"ianSak-panel.json"];
          }

          - (NSDictionary *)loadConfig {
              NSMutableDictionary *cfg = [@{
                  @"aimbot": @YES,
                  @"aimBone": @"Cabeza",
                  @"aimFov": @120,
                  @"aimSmooth": @4,
                  @"showFovCircle": @YES,
                  @"fovColor": @"Rojo",
                  @"fovThickness": @2,
                  @"cameraFov": @90,
                  @"esp": @YES,
                  @"espBox": @YES,
                  @"espName": @YES,
                  @"espHealth": @YES,
                  @"espDistance": @YES,
                  @"wallhack": @NO,
                  @"chams": @YES,
                  @"noRecoil": @YES,
                  @"noSpread": @NO,
                  @"rapidFire": @NO,
                  @"fps": @YES,
                  @"crosshair": @YES
              } mutableCopy];

              NSData *data = [NSData dataWithContentsOfURL:[self configFileURL]];
              if (data) {
                  NSDictionary *saved = [NSJSONSerialization JSONObjectWithData:data options:0 error:nil];
                  if (saved) [cfg addEntriesFromDictionary:saved];
              }
              return cfg;
          }

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor clearColor];

              CGFloat w = 320.0;
              CGFloat h = 480.0;
              CGFloat x = (self.view.bounds.size.width - w) / 2.0;
              CGFloat y = (self.view.bounds.size.height - h) / 2.0;

              self.containerView = [[UIView alloc] initWithFrame:CGRectMake(x, y, w, h)];
              self.containerView.backgroundColor = [UIColor colorWithRed:0.04 green:0.04 blue:0.06 alpha:1.0];
              self.containerView.layer.cornerRadius = 22.0;
              self.containerView.layer.borderWidth = 1.5;
              self.containerView.layer.borderColor = [UIColor colorWithRed:1.0 green:0.12 blue:0.12 alpha:0.65].CGColor;
              self.containerView.clipsToBounds = YES;
              self.containerView.hidden = YES;
              [self.view addSubview:self.containerView];

              UIPanGestureRecognizer *pan = [[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(handlePan:)];
              [self.containerView addGestureRecognizer:pan];

              WKWebViewConfiguration *config = [[WKWebViewConfiguration alloc] init];
              [config.userContentController addScriptMessageHandler:self name:@"saveConfig"];

              self.webView = [[WKWebView alloc] initWithFrame:self.containerView.bounds configuration:config];
              self.webView.opaque = NO;
              self.webView.backgroundColor = [UIColor clearColor];
              self.webView.scrollView.bounces = NO;
              [self.containerView addSubview:self.webView];

              [self renderHTML];
          }

          - (void)renderHTML {
              NSDictionary *cfg = [self loadConfig];
              NSData *jsonData = [NSJSONSerialization dataWithJSONObject:cfg options:0 error:nil];
              NSString *jsonStr = [[NSString alloc] initWithData:jsonData encoding:NSUTF8StringEncoding];

              NSString *html = [NSString stringWithFormat:
              @"<!DOCTYPE html><html><head><meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no'>"
              "<style>"
              "*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}"
              "body{margin:0;background:#0b0b0f;color:#fff;font-family:-apple-system,sans-serif;padding-bottom:24px}"
              ".top{background:linear-gradient(135deg,#ff1e1e,#7a0000);padding:16px;border-radius:0 0 20px 20px}"
              ".top h1{margin:0;font-size:20px}.top h1 span{color:#ffd700}"
              ".top p{margin:4px 0 0;font-size:11px;opacity:.85}"
              ".badge{background:rgba(255,255,255,.2);padding:3px 8px;border-radius:20px;font-size:10px;float:right}"
              ".tabs{display:flex;gap:6px;padding:10px 14px}"
              ".tab{flex:1;text-align:center;padding:8px 0;border-radius:10px;background:#1c1c22;font-size:12px;font-weight:700;color:#aaa}"
              ".tab.active{background:#ff1e1e;color:#fff}"
              ".card{margin:0 14px 10px;background:#16161c;border:1px solid #26262e;border-radius:14px;padding:4px 12px}"
              ".card h3{font-size:11px;color:#ff5555;letter-spacing:1.2px;margin:10px 0 4px}"
              ".row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #22222a}"
              ".row:last-child{border:none}.row b{font-size:14px}.row small{display:block;color:#888;font-size:10px}"
              ".sw{width:46px;height:26px;background:#2a2a33;border-radius:20px;position:relative;flex-shrink:0}"
              ".sw:before{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%%;transition:.2s}"
              ".sw.on{background:#ff1e1e}.sw.on:before{left:23px}"
              ".pill{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}"
              ".pill div{padding:6px 10px;border-radius:16px;background:#22222a;font-size:11px;color:#bbb}"
              ".pill div.on{background:#ff1e1e;color:#fff}"
              ".slider{padding:6px 0 12px}.slider label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}"
              ".slider label span{color:#ffd700;font-weight:700}"
              "input[type=range]{width:100%%;-webkit-appearance:none;height:5px;background:#2a2a33;border-radius:10px}"
              "input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:#ff1e1e;border-radius:50%%;border:2px solid #fff}"
              ".fov-preview{width:110px;height:110px;margin:10px auto;border-radius:50%%;border:2px solid #ff1e1e;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(255,30,30,.05)}"
              ".fov-preview:before{content:'';width:4px;height:4px;background:#ffd700;border-radius:50%%;position:absolute}"
              ".fov-preview span{font-size:10px;color:#aaa;margin-top:75px}"
              ".btn{width:100%%;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#ff1e1e,#c80000);color:#fff;font-size:14px;font-weight:800}"
              ".footer{padding:4px 14px}"
              "</style></head><body>"
              "<div class='top'><div class='badge'>● ONLINE</div><h1>ianSak <span>PANEL</span></h1><p>BLOOD STRIKE • v3 + FOV</p></div>"
              "<div class='tabs'>"
              "  <div class='tab active' id='t-aim' onclick=\"showTab('aim')\">🎯 AIM</div>"
              "  <div class='tab' id='t-fov' onclick=\"showTab('fov')\">👁️ FOV</div>"
              "  <div class='tab' id='t-visual' onclick=\"showTab('visual')\">✨ VISUAL</div>"
              "  <div class='tab' id='t-misc' onclick=\"showTab('misc')\">⚙️ MISC</div>"
              "</div>"
              "<div id='page-aim'>"
              "  <div class='card'><h3>AIMBOT</h3>"
              "    <div class='row'><div><b>Aimbot</b><small>Apunta al objetivo</small></div><div class='sw' id='sw-aimbot' onclick=\"tgl(this,'aimbot')\"></div></div>"
              "    <div style='padding:4px 0'><small style='color:#888'>HUESO</small><div class='pill' id='pill-aimBone'>"
              "      <div data-v='Cabeza' onclick=\"sel(this,'aimBone')\">Cabeza</div>"
              "      <div data-v='Pecho' onclick=\"sel(this,'aimBone')\">Pecho</div>"
              "      <div data-v='Cuello' onclick=\"sel(this,'aimBone')\">Cuello</div>"
              "    </div></div>"
              "    <div class='slider'><label>Suavidad <span id='smV'>4</span></label><input type='range' id='sl-aimSmooth' min='1' max='10' oninput=\"val('aimSmooth','smV',this.value)\"></div>"
              "  </div>"
              "  <div class='card'><h3>ARMA</h3>"
"    Sin Retroceso<div class='sw' id='sw-noRecoil' onclick="tgl(this,'noRecoil')">"
"    Sin Dispersión<div class='sw' id='sw-noSpread' onclick="tgl(this,'noSpread')">"
"    Fuego Rápido<div class='sw' id='sw-rapidFire' onclick="tgl(this,'rapidFire')">"
"  "
""
""
"  🎯 FOV DEL AIM"
"    FOV 120"
"    Aim FOV 120<input type='range' id='sl-aimFov' min='30' max='250' oninput="updateFov(this.value)">"
"    Mostrar círculo FOV<div class='sw' id='sw-showFovCircle' onclick="tgl(this,'showFovCircle')">"
"    COLOR"
"      <div data-v='Rojo' onclick="sel(this,'fovColor');changeColor('red')">🔴 Rojo"
"      <div data-v='Verde' onclick="sel(this,'fovColor');changeColor('lime')">🟢 Verde"
"      <div data-v='Blanco' onclick="sel(this,'fovColor');changeColor('white')">⚪ Blanco"
"      <div data-v='Amarillo' onclick="sel(this,'fovColor');changeColor('yellow')">🟡 Amarillo"
"    "
"    Grosor 2<input type='range' id='sl-fovThickness' min='1' max='5' oninput="updateTh(this.value)">"
"  "
"  📷 FOV DE CÁMARA"
"    Cámara FOV 90°<input type='range' id='sl-cameraFov' min='60' max='130' oninput="updateCam(this.value)">"
"  "
""
""
"  ESP"
"    ESP Master<div class='sw' id='sw-esp' onclick="tgl(this,'esp')">"
"    Caja / Box<div class='sw' id='sw-espBox' onclick="tgl(this,'espBox')">"
"    Nombre<div class='sw' id='sw-espName' onclick="tgl(this,'espName')">"
"    Vida<div class='sw' id='sw-espHealth' onclick="tgl(this,'espHealth')">"
"    Distancia<div class='sw' id='sw-espDistance' onclick="tgl(this,'espDistance')">"
"    Chams<div class='sw' id='sw-chams' onclick="tgl(this,'chams')">"
"    Wallhack<div class='sw' id='sw-wallhack' onclick="tgl(this,'wallhack')">"
"  "
""
""
"  EXTRA"
"    Mostrar FPS<div class='sw' id='sw-fps' onclick="tgl(this,'fps')">"
"    Crosshair<div class='sw' id='sw-crosshair' onclick="tgl(this,'crosshair')">"
"  "
""
"💾 GUARDAR Y CERRAR"
""
"let cfg = %@;"
"const colorMap = {'Rojo':'red','Verde':'lime','Blanco':'white','Amarillo':'yellow'};"
"function init(){"
"  for(let k in cfg){"
"    let sw=document.getElementById('sw-'+k); if(sw && cfg[k]) sw.classList.add('on');"
"    let sl=document.getElementById('sl-'+k); if(sl) sl.value=cfg[k];"
"  }"
"  document.getElementById('smV').innerText=cfg.aimSmooth;"
"  updateFov(cfg.aimFov);"
"  updateTh(cfg.fovThickness);"
"  updateCam(cfg.cameraFov);"
"  changeColor(colorMap[cfg.fovColor] || 'red');"
"  document.querySelectorAll('#pill-aimBone div').forEach(d=>{if(d.dataset.v==cfg.aimBone)d.classList.add('on')});"
"  document.querySelectorAll('#pill-fovColor div').forEach(d=>{if(d.dataset.v==cfg.fovColor)d.classList.add('on')});"
"}"
"function tgl(el,k){el.classList.toggle('on');cfg[k]=el.classList.contains('on')}"
"function sel(el,k){[...el.parentElement.children].forEach(c=>c.classList.remove('on'));el.classList.add('on');cfg[k]=el.dataset.v}"
"function val(k,lbl,v){document.getElementById(lbl).innerText=v;cfg[k]=parseInt(v)}"
"function updateFov(v){v=parseInt(v);cfg.aimFov=v;document.getElementById('fovV').innerText=v;document.getElementById('previewTxt').innerText='FOV '+v;let s=55+(v-30)*0.25;let p=document.getElementById('preview');p.style.width=s+'px';p.style.height=s+'px';}"
"function updateTh(v){v=parseInt(v);cfg.fovThickness=v;document.getElementById('thV').innerText=v;document.getElementById('preview').style.borderWidth=v+'px';}"
"function updateCam(v){v=parseInt(v);cfg.cameraFov=v;document.getElementById('camV').innerText=v+'°';}"
"function changeColor(c){document.getElementById('preview').style.borderColor=c}"
"function showTab(t){['aim','fov','visual','misc'].forEach(x=>{document.getElementById('page-'+x).style.display=x==t?'block':'none';document.getElementById('t-'+x).classList.toggle('active',x==t)})}"
"function guardar(){window.webkit.messageHandlers.saveConfig.postMessage(JSON.stringify(cfg));}"
"init();"
"", jsonStr];
[self.webView loadHTMLString:html baseURL:nil];
}
- (void)userContentController:(WKUserContentController *)userContentController didReceiveScriptMessage:(WKScriptMessage *)message {
if ([message.name isEqualToString:@"saveConfig"] && [message.body isKindOfClass:[NSString class]]) {
NSData *data = [(NSString *)message.body dataUsingEncoding:NSUTF8StringEncoding];
[data writeToURL:[self configFileURL] atomically:YES];
self.containerView.hidden = YES;
}
}
- (void)handlePan:(UIPanGestureRecognizer *)pan {
CGPoint trans = [pan translationInView:self.view];
self.containerView.center = CGPointMake(self.containerView.center.x + trans.x, self.containerView.center.y + trans.y);
[pan setTranslation:CGPointZero inView:self.view];
}
- (void)toggleMenu {
self.containerView.hidden = !self.containerView.hidden;
}
- (BOOL)gestureRecognizer:(UIGestureRecognizer *)g shouldRecognizeSimultaneouslyWithGestureRecognizer:(UIGestureRecognizer *)o {
return YES;
}
@end
static PassThroughWindow *gWindow = nil;
static void attachGestureToWindow(UIWindow *win, PanelViewController *vc) {
if (!win) return;
UITapGestureRecognizer *tap = [[UITapGestureRecognizer alloc] initWithTarget:vc action:@selector(toggleMenu)];
tap.numberOfTouchesRequired = 3;
tap.numberOfTapsRequired = 3;
tap.cancelsTouchesInView = NO;
tap.delegate = vc;
[win addGestureRecognizer:tap];
}
attribute((constructor))
static void initializePanel(void) {
dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(3.0 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
UIWindowScene *scene = nil;
for (UIScene *s in UIApplication.sharedApplication.connectedScenes) {
if ([s isKindOfClass:[UIWindowScene class]]) {
scene = (UIWindowScene *)s;
break;
}
}
gWindow = scene ? [[PassThroughWindow alloc] initWithWindowScene:scene]
: [[PassThroughWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
gWindow.windowLevel = UIWindowLevelAlert + 100;
gWindow.backgroundColor = [UIColor clearColor];
PanelViewController *vc = [[PanelViewController alloc] init];
gWindow.rootViewController = vc;
[gWindow makeKeyAndVisible];
attachGestureToWindow(gWindow, vc);
if (scene) {
for (UIWindow *w in scene.windows) {
if (w != gWindow) attachGestureToWindow(w, vc);
}
}
});
}
EOF
- name: Compilar dylib
run: |
make
mkdir -p salida
cp .theos/obj/debug/ianSakPanel.dylib salida/ianSakPanel.dylib
- name: Subir artefacto dylib
uses: actions/upload-artifact@v4
with:
name: ianSakPanel-dylib
path: salida/ianSakPanel.dylib
