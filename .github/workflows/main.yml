name: Build BloodStrike Mod iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Create Injection Package
      run: |
        echo "Starting build process for BloodStrike..."
        
        # Crear estructura de carpetas si no existen
        mkdir -p injection/assets
        mkdir -p injection/scripts
        
        # Copiar tus archivos clave (ajusta los nombres según tu repo)
        if [ -f "ianSak-panel.json" ]; then
          cp ianSak-panel.json injection/assets/
          echo "Copied config JSON"
        else
          echo "Warning: ianSak-panel.json not found, creating default."
          echo '{"aimbot": true}' > injection/assets/ianSak-panel.json
        fi

        # Ejemplo: Copiar tu script principal JS si existe
        if [ -d "scripts" ]; then
          cp scripts/*.js injection/scripts/ 2>/dev/null || echo "No JS scripts found in /scripts"
        fi

        # Empaquetar todo en un ZIP listo para eSing/AltStore
        cd injection
        zip -r ../BloodStrike_Mod.zip .
        cd ..

    # CAMBIO CLAVE: Se usa v4 en lugar de v3
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BloodStrike-iOS-Patch
        path: BloodStrike_Mod.zip
        retention-days: 5

    - name: Success Notification
      if: success()
      run: echo "✅ Build successful! Download the artifact below."
